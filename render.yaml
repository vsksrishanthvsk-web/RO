services:
  - type: web
    name: restaurant-ordering
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "python manage.py migrate && python manage.py seed_menu && gunicorn config.wsgi:application"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DEBUG
        value: "False"
